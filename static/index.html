<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Metadata Viewer</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <style>
body {
    font-family: Arial, sans-serif;
    margin: 10px; /* Reduce margin for smaller screens */
}

h1 {
    text-align: center;
}

#movie-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 20px;
}

.movie-card {
    cursor: pointer;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s, box-shadow 0.2s;
}

.movie-card:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
}

.movie-card img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
}

.movie-card div {
    font-size: 1em;
    font-weight: bold;
    color: #333;
}

.popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px;
    background-color: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    z-index: 1000;
    width: 90%; /* Use a percentage for flexibility */
    max-width: 400px;
}

.popup h2 {
    margin-top: 0;
}

.popup button {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.popup button:hover {
    background-color: #0056b3;
}

.overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
}

/* Media Queries for Mobile Screens */
@media (max-width: 768px) {
    body {
        margin: 5px;
    }

    #movie-grid {
        grid-template-columns: repeat(2, 1fr); /* 2 columns for medium screens */
        gap: 15px;
    }

    .movie-card {
        padding: 8px;
    }

    .popup {
        width: 95%; /* More flexible for smaller screens */
    }
}

@media (max-width: 480px) {
    #movie-grid {
        grid-template-columns: 1fr; /* Single column for small screens */
        gap: 10px;
    }

    .movie-card {
        padding: 6px;
    }

    .movie-card div {
        font-size: 0.9em; /* Slightly smaller font */
    }

    .popup {
        width: 90%; /* Keep scaling for small devices */
    }

    popup button {
        font-size: 0.9em;
        padding: 8px 16px;
    }
}

    </style>
</head>
<body>
    <h1>Movie Metadata Viewer</h1>

    <div id="movie-grid" hx-get="/movies" hx-trigger="load"></div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <h2 id="popup-title"></h2>
        <p><strong>Year:</strong> <span id="popup-year"></span></p>
        <p><strong>Genre:</strong> <span id="popup-genre"></span></p>
        <p><strong>Director:</strong> <span id="popup-director"></span></p>
        <p><strong>Plot:</strong> <span id="popup-plot"></span></p>
        <p><strong>Rotten Tomatoes Score:</strong> <span id="popup-imdbRating"></span></p>
        <button id="movie-refresh">Refresh MetaData</button>

        <button onclick="closePopup()">Close</button>
    </div>

    <script>
        // Show popup with metadata
        function refreshdata(movieId) {
            console.log(movieId);
            htmx.ajax('GET', '/refreshdata/' + movieId, { target: '#movie-refresh'});
        }
        
        function showPopup(movie) {
            var mr = document.getElementById('movie-refresh')            
            mr.setAttribute("onclick", "refreshdata(" + movie.Id+")");
            document.getElementById('popup-title').textContent = movie.Title;
            document.getElementById('popup-year').textContent = movie.Year;
            document.getElementById('popup-genre').textContent = movie.Genre;
            document.getElementById('popup-director').textContent = movie.Director;
            document.getElementById('popup-plot').textContent = movie.Plot;
            document.getElementById('popup-imdbRating').textContent = movie.imdbRating;

            document.getElementById('overlay').style.display = 'block';
            document.getElementById('popup').style.display = 'block';
            htmx.process();
        }

        // Close popup
        function closePopup() {
            var mr = document.getElementById('movie-refresh').textContent = "Refresh Data";          
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('popup').style.display = 'none';
        }

        // Close popup when clicking outside
        document.getElementById('overlay').addEventListener('click', closePopup);

        // Handle HTMX errors gracefully
        document.addEventListener('htmx:beforeSwap', function (event) {
            if (event.detail.xhr.status >= 400) {
                event.preventDefault();
                const errorDiv = document.createElement('div');
                errorDiv.classList.add('error');
                errorDiv.textContent = 'Something went wrong. Please try again.';
                document.body.appendChild(errorDiv);
            }
        });
    </script>
</body>
</html>

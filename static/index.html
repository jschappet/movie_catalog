<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Metadata Viewer</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            cursor: pointer;
            color: blue;
        }
        li:hover {
            text-decoration: underline;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }
        .popup h2 {
            margin-top: 0;
        }
        .popup button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .popup button:hover {
            background-color: #0056b3;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    
    #movie-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 20px;
    }

    .movie-card {
        cursor: pointer;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .movie-card:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .movie-card img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
    }

    .movie-card div {
        font-size: 1em;
        font-weight: bold;
        color: #333;
    }

    </style>
</head>
<body>
    <h1>Movie Metadata Viewer</h1>
<!--     <ul id="movie-list"></ul>-->    
     <div id="movie-grid" hx-get="/movies" hx-trigger="load"></div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <h2 id="popup-title"></h2>
        <p><strong>Year:</strong> <span id="popup-year"></span></p>
        <p><strong>Genre:</strong> <span id="popup-genre"></span></p>
        <p><strong>Director:</strong> <span id="popup-director"></span></p>
        <p><strong>Plot:</strong> <span id="popup-plot"></span></p>
        <p><strong>Rotten Tomatos Score:</strong> <span id="popup-imdbRating"></span></p>

        <button onclick="closePopup()">Close</button>
    </div>

    <script>


        // Show popup with metadata
        function showPopup(movie) {
            document.getElementById('popup-title').textContent = movie.Title;
            document.getElementById('popup-year').textContent = movie.Year;
            document.getElementById('popup-genre').textContent = movie.Genre;
            document.getElementById('popup-director').textContent = movie.Director;
            document.getElementById('popup-plot').textContent = movie.Plot;
            document.getElementById('popup-imdbRating').textContent = movie.imdbRating;

            document.getElementById('overlay').style.display = 'block';
            document.getElementById('popup').style.display = 'block';
        }

        // Close popup
        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('popup').style.display = 'none';
        }

        // Close popup when clicking outside
        document.getElementById('overlay').addEventListener('click', closePopup);
    </script>
<script>
    document.addEventListener('htmx:beforeSwap', function (event) {
        if (event.detail.xhr.status >= 400) {
        event.preventDefault();
        document.querySelector('.error')?.remove();
        const errorDiv = document.createElement('div');
        errorDiv.classList.add('error');
        errorDiv.textContent = 'Something went wrong. Please try again.';
        event.target.closest('form').appendChild(errorDiv);
        }
    });
</script>
</body>
</html>

[package]
name = "movie_catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
axum-extra = "0.10.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
tower = "0.5.2"
tower-http = { version = "0.6.1", features = ["fs", "trace"] }
